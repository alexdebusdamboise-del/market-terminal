<title>Sélecteur Interflon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..800&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: workshop sheet — questions on the left like a lubrication survey form,
   ranked product cards on the right; one column with a sticky jump button on phones.
   Interflon colours: white page, Interflon red (sampled from the logo) for brand and
   selection, dark grey text. Light only, like the brand. */
:root{
  color-scheme:light;
  --bg:#ffffff; --surface:#ffffff; --sunken:#f4f4f4; --line:#e1e1e1; --ink:#1e1e1e; --ink-2:#5c5c5c;
  --accent:#e2231a; --accent-hover:#c21b13; --accent-ink:#ffffff; --accent-soft:#fdecea;
  --ok:#1d7a4d; --ok-soft:#dcefe4; --warn:#9a6a00; --warn-soft:#f6ebcd; --bad:#a3160e; --bad-soft:#fbe3e1;
  --info:#2f6690; --info-soft:#dde9f3; --need:#2f6690;
  --display:"Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body:"Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r:6px;
}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);margin:0;border-top:6px solid var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--info)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;padding-inline:clamp(16px,3vw,32px);padding-block:20px 48px}

/* header */
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding-bottom:16px;border-bottom:3px solid var(--accent);margin-bottom:20px}
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px;min-width:0}
.logo{display:block;height:46px;width:auto}
.titles{display:flex;flex-direction:column;gap:4px;padding-left:22px;border-left:1px solid var(--line);min-width:0}
.eyebrow{font:600 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
h1{font:800 clamp(28px,4vw,40px)/1.05 var(--display);font-stretch:85%;margin:0;letter-spacing:-.01em;text-wrap:balance}
.note{font-size:13px;color:var(--ink-2);max-width:56ch;margin:0}

.layout{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:28px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.form{position:sticky;top:env(safe-area-inset-top,0px);max-height:calc(100vh - 24px);overflow:auto;padding:18px}

/* questions */
.q{display:flex;flex-direction:column;gap:8px;padding-block:14px;border-top:1px solid var(--line)}
.q:first-child{border-top:0;padding-top:0}
.q h2{font:700 15px/1.2 var(--display);font-stretch:100%;margin:0;display:flex;gap:8px;align-items:baseline}
.q h2 .n{font:500 12px/1 var(--mono);color:var(--accent)}
.hint{font-size:13px;color:var(--ink-2);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;line-height:1.2;min-height:36px;transition:background .12s,border-color .12s}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);background:var(--surface);padding:9px 6px;font-size:14px;min-height:40px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.temps{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2)}
.field input{border:1px solid var(--line);background:var(--sunken);border-radius:var(--r);padding:8px 10px;font:500 16px var(--mono);color:var(--ink);width:100%}
.field input[aria-invalid="true"]{border-color:var(--bad)}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets button{border:1px dashed var(--line);background:transparent;border-radius:var(--r);padding:4px 8px;font-size:13px;color:var(--ink-2)}
.presets button:hover{border-color:var(--accent);color:var(--ink)}
.presets b{font:500 12px var(--mono);color:var(--ink)}
.link{background:none;border:0;padding:0;color:var(--ink-2);text-decoration:underline;font-size:13px}
.combo{position:relative}
.suggest{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:10;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 24px color-mix(in srgb,var(--ink) 14%,transparent);max-height:320px;overflow:auto}
.suggest button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:8px 12px;font-size:14px}
.suggest button:last-child{border-bottom:0}
.suggest button:hover,.suggest button[aria-selected="true"]{background:var(--accent-soft)}
.suggest small{display:block;color:var(--ink-2);font-size:12px;line-height:1.3}
.suggest .hint{padding:8px 12px}
.mode{margin-bottom:6px}

/* results */
.results{display:flex;flex-direction:column;gap:14px;min-width:0}
.rhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.rhead h2{font:800 22px/1.15 var(--display);font-stretch:90%;margin:0}
.rhead h2 small{display:block;font:400 14px/1.4 var(--body);color:var(--ink-2);margin-top:2px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:8px 14px;font-weight:600;font-size:14px;min-height:40px}
.btn:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:10px 12px;font-size:14px}
.banner b{color:var(--warn)}
.banner.example{background:var(--info-soft)}
.banner.example b{color:var(--info)}
.banner.error{background:var(--bad-soft)}
.banner.error b{color:var(--bad)}
.banner.compet{background:var(--accent-soft)}
.banner.compet b{color:var(--accent)}
.banner .link{font-size:inherit}
/* the answers in force, always in view above the results (each one removable) */
.needbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px}
.needbar[hidden]{display:none}
.needbar .lbl{font:600 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-right:2px}
.needbar .tag{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:2px 2px 2px 10px;font-size:13px;line-height:1.2}
.needbar .tag button{border:0;background:none;min-width:28px;height:28px;border-radius:50%;color:var(--accent);font-size:16px;line-height:1;padding:0}
.needbar .tag button:hover{background:var(--accent);color:var(--accent-ink)}
.rank .tie{color:var(--ink-2);letter-spacing:.04em}
.group-note{margin:0 0 8px;font-size:13px;color:var(--ink-2)}
.badge.equiv{background:var(--accent-soft);color:var(--accent)}

.card{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.card.top1{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card.out{opacity:.72}
.ch{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.rank{font:500 12px/1 var(--mono);color:var(--accent);letter-spacing:.08em}
.pname{font:800 21px/1.15 var(--display);font-stretch:88%;margin:2px 0 6px}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{font:500 12px/1 var(--mono);padding:4px 7px;border-radius:4px;background:var(--sunken);color:var(--ink-2);white-space:nowrap}
.badge.h1{background:var(--ok-soft);color:var(--ok)}
.badge.nsf{background:var(--info-soft);color:var(--info)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.vmark{font:500 12px/1 var(--mono);margin-left:4px;white-space:nowrap}
/* what a sheet lacks can be long: let it wrap instead of widening the card */
.badge.warn{white-space:normal;line-height:1.3;text-align:left}
/* eligible but a hard criterion could not be checked on the sheet */
.unchecked{background:var(--warn-soft);color:var(--warn);font-size:13px;line-height:1.35;padding:6px 10px;border-radius:6px;margin:0 0 10px}
.ch > div{min-width:0}
.vmark.ok{color:var(--ok)}
.vmark.warn{color:var(--warn)}
.desc{margin:0;max-width:75ch}
.specs{display:flex;flex-wrap:wrap;gap:4px 18px;font:400 13px/1.4 var(--mono);color:var(--ink-2);font-variant-numeric:tabular-nums}
.specs b{color:var(--ink);font-weight:500}

/* temperature scale */
.tscale{position:relative;height:30px;margin-top:2px}
.tscale .track{position:absolute;left:0;right:0;top:6px;height:8px;background:var(--sunken);border-radius:4px}
.tscale .p{position:absolute;top:6px;height:8px;background:var(--accent);border-radius:4px}
.tscale .unk{position:absolute;top:6px;height:8px;background:repeating-linear-gradient(45deg,var(--accent) 0 3px,transparent 3px 7px);opacity:.6}
.tscale .need{position:absolute;top:2px;height:16px;border:2px solid var(--need);border-radius:4px}
.tscale .tick{position:absolute;top:18px;font:400 10px/1 var(--mono);color:var(--ink-2);transform:translateX(-50%)}
.tscale .tick::before{content:"";position:absolute;left:50%;top:-6px;height:4px;border-left:1px solid var(--line)}

.reasons{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px 16px;font-size:14px}
.reasons li{display:flex;gap:8px;align-items:baseline}
.reasons .m{font:600 13px var(--mono);flex:none;width:14px;text-align:center}
.reasons .y .m{color:var(--ok)} .reasons .u .m,.reasons .a .m{color:var(--warn)} .reasons .r .m{color:var(--info)} .reasons .n .m{color:var(--bad)}
.reasons .n{color:var(--bad)}
.cards{display:flex;flex-direction:column;gap:12px}
details.more summary{cursor:pointer;font:700 15px var(--display);padding:6px 0;color:var(--ink-2)}
.empty{padding:28px;text-align:center;color:var(--ink-2)}

/* product sheet */
.sheet{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 45%,transparent);display:flex;justify-content:flex-end;z-index:20}
.sheet[hidden]{display:none!important}
.sheet a{overflow-wrap:anywhere}
.sheet .inner{width:min(560px,100%);height:100%;overflow:auto;background:var(--surface);padding:20px 22px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet h3{font:700 13px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:8px 0 0}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 12px;margin:0;font-size:15px}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;font-variant-numeric:tabular-nums}
.sheet ul{margin:0;padding-left:18px} .sheet li{margin:3px 0}
.quote{font-size:13px;color:var(--ink-2)}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.jump{display:none}

@media (max-width: 880px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .form{position:static;max-height:none}
  .jump{display:block;position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));margin-top:-4px;width:100%;z-index:5;box-shadow:0 6px 18px color-mix(in srgb,var(--ink) 25%,transparent)}
  .kv{grid-template-columns:110px minmax(0,1fr)}
}
@media (max-width: 560px){
  .logo{height:36px}
  .titles{padding-left:0;border-left:0}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* customer sheet (A4), rendered only while printing */
#print-area{display:none}
@media print{
  @page{size:A4;margin:12mm 13mm 13mm}
  body.printing{background:#fff;border-top:0;height:auto}
  body.printing > *:not(#print-area){display:none!important}
  body.printing #print-area{display:block!important}
  .pr{color:#1e1e1e;font-family:var(--body);font-size:9.5pt;line-height:1.38;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pr-head{display:flex;align-items:center;gap:18pt;padding-bottom:8pt;border-bottom:3pt solid #e2231a;margin-bottom:10pt}
  .pr-head img{height:28pt;width:auto}
  .pr-kicker{font-family:var(--mono);font-weight:600;font-size:8.5pt;letter-spacing:.12em;text-transform:uppercase;color:#5c5c5c}
  .pr-client{font-family:var(--display);font-weight:800;font-size:16pt;line-height:1.1;font-stretch:88%;margin:2pt 0}
  .pr-meta{font-size:9pt;color:#5c5c5c}
  .pr h2{font-family:var(--mono);font-weight:700;font-size:9pt;letter-spacing:.1em;text-transform:uppercase;color:#e2231a;margin:0 0 4pt}
  .pr-need{background:#f4f4f4;padding:6pt 9pt;margin-bottom:10pt}
  .pr-need ul{margin:0;padding-left:14pt}
  .pr-prod{border-left:3pt solid #e2231a;padding:1pt 0 1pt 9pt;margin:0 0 9pt;break-inside:avoid}
  .pr-rank{font-family:var(--mono);font-weight:600;font-size:8pt;color:#e2231a;letter-spacing:.1em;text-transform:uppercase}
  .pr-prod h3{font-family:var(--display);font-weight:800;font-size:13pt;line-height:1.2;font-stretch:90%;margin:1pt 0 3pt}
  .pr-nsf{font-family:var(--mono);font-weight:500;font-size:8.5pt;color:#1d7a4d;margin-left:6pt}
  .pr-prod p{margin:2pt 0}
  .pr-ok,.pr-check{list-style:none;margin:3pt 0;padding:0;columns:2;column-gap:14pt}
  .pr-ok li,.pr-check li{break-inside:avoid;display:flex;gap:5pt}
  .pr-ok span{color:#1d7a4d;font-weight:700}
  .pr-check span{color:#9a6a00;font-weight:700}
  .pr-sub{font-weight:600;font-size:9pt}
  .pr-specs{font-family:var(--mono);font-size:8.5pt;line-height:1.4;color:#5c5c5c}
  .pr-alert{color:#a3160e;font-weight:700}
  .pr-foot{margin-top:10pt;padding-top:5pt;border-top:1px solid #ccc;font-size:7.5pt;color:#5c5c5c}
}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <img class="logo" src="img/logo-interflon.png" alt="Interflon" width="480" height="112">
      <div class="titles">
        <span class="eyebrow">Aide au choix</span>
        <h1>Sélecteur de lubrifiants</h1>
      </div>
    </div>
    <p class="note" id="data-note">Fiches établies à partir des sources publiques Interflon : à valider par le service technique avant tout engagement client.</p>
  </header>

  <div class="layout">
    <aside class="panel form" aria-label="Besoin du client">
      <div class="seg mode" role="group" aria-label="Point de départ">
        <button type="button" id="mode-besoin" data-mode="besoin">Décrire le besoin</button>
        <button type="button" id="mode-remplacement" data-mode="remplacement">Remplacer un produit</button>
      </div>
      <div id="questions"></div>
      <button type="button" class="link" id="reset">Tout effacer</button>
    </aside>

    <main class="results" id="results-panel">
      <div class="needbar" id="needbar" hidden></div>
      <div class="rhead">
        <h2 id="r-title">Produits recommandés</h2>
        <div class="actions">
          <button type="button" class="btn" id="print" hidden>Imprimer / PDF</button>
          <button type="button" class="btn ghost" id="copy">Copier la recommandation</button>
        </div>
      </div>
      <div id="banners"></div>
      <div id="results"></div>
    </main>
  </div>
  <button type="button" class="btn jump" id="jump">Voir les produits ↓</button>
</div>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="inner">
    <div class="ch"><div><span class="rank">FICHE PRODUIT</span><div class="pname" id="sheet-title"></div></div><button type="button" class="btn ghost" id="sheet-close">Fermer</button></div>
    <div id="sheet-body"></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<div id="print-area" hidden></div>

<script src="js/selector-core.js"></script>
<script>
(function () {
  "use strict";
  const C = window.SelectorCore;
  const $ = (s, r) => (r || document).querySelector(s);
  const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
  const esc = (s) => (s === null || s === undefined ? "" : String(s).replace(/[&<>"']/g, (c) => ESC[c]));
  const safeUrl = (u) => (/^https?:\/\//i.test(String(u || "")) ? String(u) : "#");
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };
  const LS = "ifx.selecteur.criteres";

  const FAMILIES = { huile: "Huile", graisse: "Graisse", aerosol: "Aérosol", nettoyant: "Nettoyant", degraissant: "Dégraissant", agent_demoulage: "Démoulant", lubrificateur_automatique: "Graisseur automatique", accessoire: "Accessoire", autre: "Autre" };
  const ENV = [["resistant_eau", "Eau, humidité"], ["lavage_frequent", "Lavages fréquents"], ["environnement_poussiereux", "Poussière, saleté"], ["charges_elevees_chocs", "Charges élevées, chocs"], ["vitesse_elevee", "Vitesse élevée"], ["anti_corrosion", "Corrosion, extérieur"], ["compatible_plastiques_joints", "Plastiques, joints"], ["biodegradable", "Biodégradable exigé"], ["sans_pfas", "Sans PFAS exigé"]];
  const PRESETS = [["Surgélation", -40, -18], ["Froid", -5, 10], ["Ambiant", 5, 40], ["Chaud", 20, 120], ["Four, étuve", 50, 250], ["Très haute", "", 300]];
  // loaded only when asked ("Voir un exemple"), never as the opening state
  const EXAMPLE = { mode: "besoin", food: "oui", application: "chaines", tmin: "50", tmax: "250", env: [], formats: [], replaceType: "", iso_vg: "", nlgi: "", query: "", competitor: "" };
  // fromCompetitor: the answers a competitor product filled in, so "retirer" can undo them
  const blank = () => ({ mode: "besoin", food: "", application: "", tmin: "", tmax: "", env: [], formats: [], replaceType: "", iso_vg: "", nlgi: "", query: "", competitor: "", client: "", fromCompetitor: {} });
  const LS_AUTHOR = "ifx.selecteur.auteur";
  let author = "";
  // Printing works in the installed version only: claude.ai pages cannot open the print dialog
  const CAN_PRINT = location.protocol === "file:" || /^(127\.0\.0\.1|localhost|\[::1\])$/.test(location.hostname);

  let PRODUCTS = [];
  let EQUIV = [];
  const norm = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const eqKey = (e) => `${e.marque} | ${e.reference}`;
  const noEquivalent = (e) => !e.interflon && !e.replace_type && !e.application;
  const currentEquiv = () => (crit.mode === "remplacement" && crit.competitor ? EQUIV.find((e) => eqKey(e) === crit.competitor) || null : null);
  const eqName = (e) => (norm(e.reference).startsWith(norm(e.marque)) ? e.reference : `${e.marque} ${e.reference}`);
  const eqSpecs = (e) => [e.type, e.nsf ? `NSF ${e.nsf}${e.nsf_reg_no ? " n° " + e.nsf_reg_no : ""}` : "sans NSF connu", known(e.temp_min_c) || known(e.temp_max_c) ? `${known(e.temp_min_c) ? e.temp_min_c : "?"} → ${known(e.temp_max_c) ? e.temp_max_c : "?"} °C` : "", e.iso_vg ? `ISO VG ${e.iso_vg}` : "", e.nlgi ? `NLGI ${e.nlgi}` : ""].filter(Boolean).join(" · ");
  let isExample = false;
  // answers restored from the last visit: said so until the first change
  let restored = false;
  let crit = blank();
  let ranked = [];

  const known = (x) => x !== null && x !== undefined && x !== "";
  // y conforme · n non conforme · u donnée manquante · a à vérifier chez le client · r voisin (organe ou propriété)
  const MARK = { y: "✓", n: "✕", u: "?", a: "!", r: "≈" };
  const LEGEND = { y: "✓ conforme", r: "≈ voisin, à confirmer", a: "! à vérifier chez le client", u: "? donnée manquante", n: "✕ non conforme" };
  const EQUIP = new Set(["lubrificateur_automatique", "accessoire"]);
  const tempRange = (p) => (p.temp_na ? "sans objet" : !known(p.temp_min_c) && !known(p.temp_max_c) ? "non renseignée" : `${known(p.temp_min_c) ? p.temp_min_c : "?"} → ${known(p.temp_max_c) ? p.temp_max_c : "?"} °C`);
  const tempTxt = (p) => tempRange(p) + (known(p.temp_min_gearbox_c) && !p.temp_na ? ` (réducteur : ${p.temp_min_gearbox_c} °C mini)` : "");
  // "temp_max_c (source unique)" -> "Température maxi (source unique)"
  const FIELD_LABEL = { nsf_reg_no: "N° d'enregistrement NSF", nsf: "Homologation NSF", temp_min_c: "Température mini", temp_max_c: "Température maxi",
    viscosity_iso_vg: "Viscosité", nlgi: "Grade NLGI", base: "Huile de base", formats: "Conditionnements", applications: "Applications", properties: "Propriétés" };
  const doubtTxt = (f) => String(f).replace(/^(nsf_reg_no|nsf|temp_min_c|temp_max_c|viscosity_iso_vg|nlgi|base|formats|applications|properties)\b/, (k) => FIELD_LABEL[k]);
  // ISO VG grade when the source gives one, otherwise the measured viscosity at 40 °C
  const viscTxt = (p) => (p.viscosity_iso_vg ? `ISO VG ${p.viscosity_iso_vg}` : known(p.viscosity_cst40) ? `${p.viscosity_cst40} cSt à 40 °C` : "");
  const isVerified = C.isVerified;
  // temperature checked on its own: a sheet that only lacks its packaging keeps a verified range
  const TEMP_MARK = {
    ok: `<span class="vmark ok" title="Plage appuyée par une citation de sa source (Fiche ▸ Preuves)">✓ vérifiée</span>`,
    doubt: `<span class="vmark warn" title="Plage relevée, source à confirmer">à confirmer</span>`,
  };
  const tempMark = (p) => TEMP_MARK[C.tempStatus(p)] || "";
  // badge of the whole sheet, saying what is missing instead of a vague "à valider"
  const sheetBadge = (p) => (isVerified(p) ? `<span class="badge ok">fiche vérifiée</span>` : `<span class="badge warn" title="${esc(C.gapsText(p))}">${esc(C.gapsText(p) || "à confirmer")}</span>`);
  function parseTemp(raw) {
    const s = String(raw === undefined || raw === null ? "" : raw).replace(/[−–—]/g, "-").replace(/°\s*c?|\s/gi, "").replace(",", ".");
    if (!s || s === "-") return "";
    return /^-?\d+(\.\d+)?$/.test(s) ? Number(s) : NaN;
  }

  function sanitize(s) {
    const c = blank();
    if (!s || typeof s !== "object") return c;
    if (["besoin", "remplacement"].includes(s.mode)) c.mode = s.mode;
    if (["oui", "non", "nsp"].includes(s.food)) c.food = s.food;
    if (C.APPLICATIONS[s.application]) c.application = s.application;
    if (C.REPLACE_TYPES[s.replaceType]) c.replaceType = s.replaceType;
    c.env = (Array.isArray(s.env) ? s.env : []).filter((k) => ENV.some(([e]) => e === k));
    c.formats = (Array.isArray(s.formats) ? s.formats : []).filter((k) => C.FORMATS[k]);
    ["tmin", "tmax", "iso_vg", "nlgi", "query"].forEach((k) => { if (typeof s[k] === "string" || typeof s[k] === "number") c[k] = String(s[k]).slice(0, 60); });
    if (typeof s.competitor === "string") c.competitor = s.competitor.slice(0, 160);
    if (typeof s.client === "string") c.client = s.client.slice(0, 120);
    if (s.fromCompetitor && typeof s.fromCompetitor === "object") {
      ["replaceType", "application", "food", "tmin", "tmax", "iso_vg", "nlgi"].forEach((k) => {
        const v = s.fromCompetitor[k];
        if (v && typeof v === "object" && typeof v.was === "string" && typeof v.set === "string") c.fromCompetitor[k] = { was: v.was.slice(0, 60), set: v.set.slice(0, 60) };
      });
    }
    return c;
  }

  function effective() {
    const c = { food: crit.food || null, application: crit.application || null, tmin: parseTemp(crit.tmin), tmax: parseTemp(crit.tmax), env: crit.env.slice(), formats: crit.formats.slice(), query: crit.query };
    if (crit.mode === "remplacement") {
      c.iso_vg = crit.iso_vg; c.nlgi = crit.nlgi;
      const t = C.REPLACE_TYPES[crit.replaceType];
      if (t) {
        if (t.families) c.families = t.families;
        (t.env || []).forEach((e) => c.env.includes(e) || c.env.push(e));
      }
    }
    c.badTemp = Number.isNaN(c.tmin) || Number.isNaN(c.tmax);
    return c;
  }
  const hasCriteria = (c) => !!(c.food || c.application || c.tmin !== "" || c.tmax !== "" || c.env.length || c.formats.length || c.query || c.families || c.iso_vg || c.nlgi);

  // ------------------------------------------------------------ questions
  const chips = (name, entries, current, multi) =>
    `<div class="chips" data-name="${name}" data-multi="${multi ? 1 : 0}">${entries
      .map(([k, l]) => `<button type="button" class="chip" data-v="${esc(k)}" aria-pressed="${multi ? current.includes(k) : current === k}">${esc(l)}</button>`)
      .join("")}</div>`;

  function renderQuestions() {
    $("#mode-besoin").setAttribute("aria-pressed", crit.mode === "besoin");
    $("#mode-remplacement").setAttribute("aria-pressed", crit.mode === "remplacement");
    const apps = Object.entries(C.APPLICATIONS).filter(([k]) => k === crit.application || (k !== "autre" && PRODUCTS.some((p) => (p.applications || []).includes(k))));
    let n = 0;
    const num = () => String(++n).padStart(2, "0");
    const eq = currentEquiv();
    $("#questions").innerHTML = `
      ${crit.mode === "remplacement" && EQUIV.length ? `<section class="q"><h2><span class="n">${num()}</span>Produit concurrent</h2><p class="hint">Marque ou référence du produit en place : les critères se remplissent avec ses caractéristiques.</p>
        <div class="combo"><label class="field" for="competitor">Recherche<input id="competitor" autocomplete="off" placeholder="ex. Klübersynth UH1, Nevastane, WD-40" value="${esc(eq ? eqName(eq) : "")}" aria-controls="competitor-list" aria-autocomplete="list"></label>
        <div class="suggest" id="competitor-list" role="listbox" hidden></div></div></section>` : ""}
      ${crit.mode === "remplacement" ? `<section class="q"><h2><span class="n">${num()}</span>Produit utilisé aujourd'hui</h2><p class="hint">Type de produit du client, toutes marques.</p>
        ${chips("replaceType", Object.entries(C.REPLACE_TYPES).map(([k, v]) => [k, v.label]), crit.replaceType, false)}
        <div class="temps"><label class="field" for="iso_vg">Viscosité ISO VG<input id="iso_vg" inputmode="numeric" placeholder="ex. 220" value="${esc(crit.iso_vg)}"></label>
        <label class="field" for="nlgi">Grade NLGI<input id="nlgi" placeholder="ex. 2" value="${esc(crit.nlgi)}"></label></div></section>` : ""}
      <section class="q"><h2><span class="n">${num()}</span>Contact alimentaire possible ?</h2><p class="hint">Agroalimentaire, boissons, pharmacie, emballage alimentaire : un contact fortuit impose la catégorie NSF H1.</p>
        <div class="seg" role="group" aria-label="Contact alimentaire" data-name="food">${[["oui", "Oui, NSF H1"], ["non", "Non"], ["nsp", "Je ne sais pas"]].map(([k, l]) => `<button type="button" data-v="${k}" aria-pressed="${crit.food === k}">${l}</button>`).join("")}</div></section>
      <section class="q"><h2><span class="n">${num()}</span>Organe à lubrifier</h2>${chips("application", apps, crit.application, false)}</section>
      <section class="q"><h2><span class="n">${num()}</span>Température de fonctionnement</h2>
        <div class="temps"><label class="field" for="tmin">Mini (°C)<input id="tmin" autocomplete="off" placeholder="ex. -20" value="${esc(crit.tmin)}"></label>
        <label class="field" for="tmax">Maxi (°C)<input id="tmax" autocomplete="off" placeholder="ex. 180" value="${esc(crit.tmax)}"></label></div>
        <div class="presets">${PRESETS.map(([l, a, b], i) => `<button type="button" data-preset="${i}">${esc(l)} <b>${a === "" ? "" : a + " / "}${b} °C</b></button>`).join("")}</div></section>
      <section class="q"><h2><span class="n">${num()}</span>Conditions</h2>${chips("env", ENV, crit.env, true)}</section>
      <section class="q"><h2><span class="n">${num()}</span>Conditionnement souhaité</h2>${chips("formats", Object.entries(C.FORMATS), crit.formats, true)}</section>
      <section class="q"><h2><span class="n">${num()}</span>Recherche libre</h2><label class="field" for="query">Nom, mot-clé<input id="query" placeholder="ex. Food Grease" value="${esc(crit.query)}"></label></section>
      <section class="q"><h2><span class="n">${num()}</span>Pour la fiche client</h2><p class="hint">Repris sur la recommandation copiée ou imprimée.</p>
        <div class="temps"><label class="field" for="client">Client, site<input id="client" autocomplete="off" placeholder="ex. Fromagerie X, Rodez" value="${esc(crit.client)}"></label>
        <label class="field" for="author">Établie par<input id="author" autocomplete="name" placeholder="Ton nom" value="${esc(author)}"></label></div></section>`;
    markTemp();
  }

  function markTemp() {
    ["tmin", "tmax"].forEach((k) => { const el = $("#" + k); if (el) el.setAttribute("aria-invalid", Number.isNaN(parseTemp(crit[k]))); });
  }

  function changed(rerender) {
    isExample = false;
    restored = false;
    store.set(LS, crit);
    if (rerender) renderQuestions();
    markTemp();
    renderResults();
  }

  // ------------------------------------------------------------ results
  const pos = (x) => Math.max(0, Math.min(100, ((x + 60) / 460) * 100));
  function tscale(p, c) {
    const a = known(p.temp_min_c) ? p.temp_min_c : null;
    const b = known(p.temp_max_c) ? p.temp_max_c : null;
    if (a === null && b === null) return "";
    const lo = a === null ? b : a, hi = b === null ? a : b;
    const unk = a === null ? `<span class="unk" style="left:${Math.max(0, pos(b) - 8)}%;width:${pos(b) - Math.max(0, pos(b) - 8)}%"></span>` : b === null ? `<span class="unk" style="left:${pos(a)}%;width:${Math.min(100, pos(a) + 8) - pos(a)}%"></span>` : "";
    const tn = typeof c.tmin === "number" && !isNaN(c.tmin) ? c.tmin : null;
    const tx = typeof c.tmax === "number" && !isNaN(c.tmax) ? c.tmax : null;
    const need = tn !== null || tx !== null ? `<span class="need" style="left:${pos(tn === null ? tx : tn)}%;width:${Math.max(0.8, pos(tx === null ? tn : tx) - pos(tn === null ? tx : tn))}%" title="Besoin du client"></span>` : "";
    const ticks = [-40, 0, 100, 200, 300, 400].map((t) => `<span class="tick" style="left:${pos(t)}%">${t}</span>`).join("");
    return `<div class="tscale" aria-label="Plage du produit ${esc(tempTxt(p))}"><span class="track"></span><span class="p" style="left:${pos(lo)}%;width:${Math.max(0.8, pos(hi) - pos(lo))}%"></span>${unk}${need}${ticks}</div>`;
  }

  // rank: {n, tie} for the first choices (CHOIX n, shared when only the name differs), null otherwise
  function card(r, c, rank) {
    const p = r.product;
    const h1 = C.nsfList(p).includes("H1");
    const specs = [`<span>Température <b>${esc(tempTxt(p))}</b> ${tempMark(p)}</span>`];
    if (p.viscosity_iso_vg) specs.push(`<span>ISO VG <b>${esc(p.viscosity_iso_vg)}</b></span>`);
    else if (known(p.viscosity_cst40)) specs.push(`<span><b>${esc(p.viscosity_cst40)}</b> cSt à 40 °C</span>`);
    if (p.nlgi) specs.push(`<span>NLGI <b>${esc(p.nlgi)}</b></span>`);
    if ((p.formats || []).length) specs.push(`<span>${esc(p.formats.join(", "))}</span>`);
    return `<article class="panel card ${rank && rank.n === 1 ? "top1" : ""} ${r.eligible ? "" : "out"}">
      ${r.eligible && r.unchecked.length ? `<p class="unchecked">Non vérifié : ${esc(r.unchecked.join(", "))}, donnée manquante sur la fiche. À confirmer avec le service technique.</p>` : ""}
      <div class="ch"><div>${rank ? `<span class="rank">CHOIX ${rank.n}${rank.tie ? ` <span class="tie">· EX ÆQUO</span>` : ""}</span>` : ""}<div class="pname">${esc(p.name)}</div>
        <div class="badges">${p.nsf ? `<span class="badge ${h1 ? "h1" : "nsf"}">NSF ${esc(p.nsf)}</span>` : `<span class="badge">sans NSF</span>`}<span class="badge">${esc(FAMILIES[p.family] || p.family)}</span>${sheetBadge(p)}${currentEquiv() && currentEquiv().interflon === p.name ? `<span class="badge equiv">équivalence proposée</span>` : ""}</div></div>
        <button type="button" class="btn ghost" data-detail="${esc(p.id)}">Fiche</button></div>
      ${p.description_fr ? `<p class="desc">${esc(p.description_fr)}</p>` : ""}
      <div class="specs">${specs.join("")}</div>
      ${tscale(p, c)}
      ${r.reasons.length ? `<ul class="reasons">${r.reasons.map((x) => `<li class="${x.s}"><span class="m">${MARK[x.s] || "?"}</span><span>${esc(x.t)}</span></li>`).join("")}</ul>` : ""}
    </article>`;
  }

  // CHOIX 1..3 among the products made for the requested organ; products that only
  // their name tells apart share the number and say "ex æquo"
  function choiceRanks(list) {
    const n = [];
    list.forEach((r, i) => { n[i] = i > 0 && !C.compare(list[i - 1], r) ? n[i - 1] : i + 1; });
    return list.map((r, i) => (n[i] <= 3 ? { n: n[i], tie: n[i - 1] === n[i] || n[i + 1] === n[i] } : null));
  }
  // several products equal on every criterion: say what would tell them apart
  function tiedTop(ok, organ, c) {
    const tied = ok.filter((r) => !C.compare(ok[0], r));
    if (!organ || tied.length < 3) return "";
    // only criteria not given yet that some of them meet and others not
    const sp = C.splitters(tied.map((r) => r.product), c, ENV.map(([k]) => k));
    const hints = [];
    if (sp.temp) hints.push("la température");
    if (sp.env.length) hints.push(`une condition (${sp.env.map((e) => (ENV.find(([k]) => k === e) || [e, e])[1].toLowerCase()).join(" ; ")})`);
    if (sp.formats.length) hints.push(`le conditionnement (${sp.formats.map((f) => C.FORMATS[f].toLowerCase()).join(" ; ")})`);
    return `<p class="group-note">${tied.length} produits à égalité sur ces critères : ${hints.length ? `précise ${hints.join(", ")} pour les départager` : "à départager avec le service technique"}.</p>`;
  }
  // groups shown apart from the recommendation: made for the requested organ ("main"),
  // for a neighbouring organ, additives for the oil in place, data missing, excluded
  function groups(list) {
    return {
      ok: list.filter((r) => r.verified && r.group === "main"),
      near: list.filter((r) => r.verified && r.group === "related"),
      adds: list.filter((r) => r.verified && r.group === "additive"),
      pending: list.filter((r) => r.eligible && !r.verified),
      out: list.filter((r) => !r.eligible),
    };
  }

  // ------------------------------------------------------------ active criteria
  const FOOD_TXT = { oui: "oui (NSF H1)", non: "non", nsp: "à préciser" };
  function needTags() {
    const t = [];
    const eq = currentEquiv();
    const repl = crit.mode === "remplacement";
    if (eq) t.push([`Remplace ${eqName(eq)}`, "competitor"]);
    if (repl && C.REPLACE_TYPES[crit.replaceType]) t.push([C.REPLACE_TYPES[crit.replaceType].label, "replaceType"]);
    if (crit.food) t.push([`Contact alimentaire : ${FOOD_TXT[crit.food]}`, "food"]);
    if (crit.application) t.push([C.APPLICATIONS[crit.application] || crit.application, "application"]);
    const tr = C.needRange(crit);
    if (tr) t.push([C.needText(tr), "temp"]);
    else if (crit.tmin !== "" || crit.tmax !== "") t.push([`${crit.tmin || "?"} → ${crit.tmax || "?"} °C`, "temp"]);
    crit.env.forEach((e) => t.push([(ENV.find(([k]) => k === e) || [e, e])[1], "env:" + e]));
    crit.formats.forEach((f) => t.push([C.FORMATS[f] || f, "formats:" + f]));
    if (repl && crit.iso_vg) t.push([`ISO VG ${crit.iso_vg}`, "iso_vg"]);
    if (repl && crit.nlgi) t.push([`NLGI ${crit.nlgi}`, "nlgi"]);
    if (crit.query) t.push([`« ${crit.query} »`, "query"]);
    return t;
  }
  function renderNeedbar() {
    const t = needTags();
    const bar = $("#needbar");
    bar.hidden = !t.length;
    bar.innerHTML = t.length
      ? `<span class="lbl">Critères actifs</span>${t.map(([l, k]) => `<span class="tag">${esc(l)}<button type="button" data-drop="${esc(k)}" aria-label="Retirer : ${esc(l)}" title="Retirer">×</button></span>`).join("")}<button type="button" class="link" data-reset>Tout effacer</button>`
      : "";
  }

  function renderResults() {
    const c = effective();
    // the documented equivalence (still to validate) keeps its rank: badged on its card
    // and named in the banner, never pinned above better-suited products
    const eq = currentEquiv();
    ranked = eq && noEquivalent(eq) ? [] : C.rank(PRODUCTS, c);
    // recommended = made for the requested organ and every hard criterion checked on
    // sourced data; everything else is listed apart, never among the choices
    const { ok, near, adds, pending, out } = groups(ranked);
    renderNeedbar();
    const banners = [];
    if (isExample) banners.push(`<div class="banner example"><b>Exemple</b><span>Chaînes de four en usine alimentaire, 50 à 250 °C. Retire un critère avec × ou clique sur « Tout effacer » pour décrire ton besoin.</span></div>`);
    else if (restored) banners.push(`<div class="banner example"><b>Reprise</b><span>Réponses de ta dernière visite, rappelées ci-dessus. <button type="button" class="link" data-reset>Tout effacer</button> pour un nouveau besoin.</span></div>`);
    if (eq) {
      const direct = eq.interflon ? ` Équivalence proposée (${esc(eq.origine)}) : <strong>${esc(eq.interflon)}</strong>, à valider par le service technique.` : "";
      const none = noEquivalent(eq) && !/pas d'équivalent/i.test(eq.note || "") ? " Pas d'équivalent Interflon référencé." : "";
      const fromEq = crit.fromCompetitor && crit.fromCompetitor.tmax;
      const temps = fromEq && crit.tmax === fromEq.set
        ? ` Produit haute température : sa limite de ${esc(fromEq.set)} °C est reprise comme besoin. Remplace-la par la température réelle de la machine si tu la connais.`
        : (known(eq.temp_min_c) || known(eq.temp_max_c)) && crit.tmin === "" && crit.tmax === "" ? " Indique la température réelle de la machine pour affiner le choix." : "";
      const prop = eq.interflon ? ranked.find((r) => r.product.name === eq.interflon) : null;
      const where = !prop ? "" : !prop.eligible ? ` Avec ces critères, elle est écartée (${esc(prop.blockers.join(" ; "))}) : voir « Produits écartés ».`
        : !prop.verified ? ` Sa fiche ne permet pas de vérifier : ${esc(prop.unchecked.join(", "))}. Voir « À vérifier ».`
        : prop.group === "related" ? " Elle est prévue pour un organe voisin : voir plus bas."
        : prop.group === "additive" ? " C'est un additif à ajouter à l'huile en place : voir plus bas." : "";
      banners.push(`<div class="banner compet"><b>Remplace</b><span><strong>${esc(eqName(eq))}</strong> : ${esc(eqSpecs(eq))}.${direct}${where}${none}${eq.note ? " " + esc(eq.note) : ""}${temps} ${eq.source ? `<a href="${esc(safeUrl(eq.source))}" target="_blank" rel="noopener">Fiche du produit concurrent</a>` : `<span class="quote">Source : ${esc(eq.origine)}</span>`} · <button type="button" class="link" data-clear-competitor>retirer</button></span></div>`);
    }
    if (c.badTemp) banners.push(`<div class="banner error"><b>Température illisible</b><span>Saisis un nombre, par exemple -20 ou 180. Aucune recommandation tant qu'elle n'est pas comprise.</span></div>`);
    $("#banners").innerHTML = banners.join("");
    $("#jump").textContent = !hasCriteria(c) || c.badTemp || (eq && noEquivalent(eq)) ? "Voir les produits ↓" : ok.length === 0 ? "Aucun produit : voir pourquoi ↓" : ok.length === 1 ? "Voir le produit ↓" : `Voir les ${ok.length} produits ↓`;
    if (!PRODUCTS.length) { $("#results").innerHTML = `<div class="panel empty">Catalogue indisponible.</div>`; return; }
    if (eq && noEquivalent(eq)) { $("#r-title").innerHTML = "Pas d'équivalent Interflon"; $("#results").innerHTML = `<div class="panel empty">${esc(eq.reference)} (${esc(eq.type)}) n'a pas d'équivalent dans la gamme Interflon.</div>`; return; }
    if (c.badTemp) { $("#r-title").innerHTML = "Produits recommandés"; $("#results").innerHTML = ""; return; }
    if (!hasCriteria(c)) {
      $("#r-title").innerHTML = `Tout le catalogue<small>${PRODUCTS.length} produits · réponds aux questions pour filtrer · <button type="button" class="link" data-example>voir un exemple</button></small>`;
      $("#results").innerHTML = `<div class="cards">${ranked.slice().sort((a, b) => a.product.name.localeCompare(b.product.name)).map((r) => card(r, c, null)).join("")}</div>`;
      return;
    }
    const seen = new Set(ranked.flatMap((r) => r.reasons.map((x) => x.s)));
    const legend = ["y", "r", "a", "u", "n"].filter((k) => seen.has(k)).map((k) => LEGEND[k]).join(" · ");
    const organ = c.application ? C.APPLICATIONS[c.application] || c.application : "";
    // a ranking needs the organ: without it, the products are only compatible
    const ranks = organ ? choiceRanks(ok) : [];
    $("#r-title").innerHTML = organ
      ? `${ok.length} produit${ok.length > 1 ? "s conviennent" : " convient"}<small>sur ${PRODUCTS.length} · ${ok.length > 1 ? "classés par pertinence pour" : "pour"} « ${esc(organ)} »${legend ? " · " + legend : ""}</small>`
      : `${ok.length} produit${ok.length > 1 ? "s compatibles" : " compatible"}<small>sur ${PRODUCTS.length} · choisis l'organe à lubrifier pour les classer${legend ? " · " + legend : ""}</small>`;
    const others = near.length || pending.length || adds.length;
    const group = (list, title, note, open) => (list.length ? `<details class="more" ${open ? "open" : ""}><summary>${title} (${list.length})</summary>${note ? `<p class="group-note">${note}</p>` : ""}<div class="cards">${list.map((r) => card(r, c, null)).join("")}</div></details>` : "");
    $("#results").innerHTML =
      (ok.length ? `${tiedTop(ok, organ, c)}<div class="cards">${ok.map((r, i) => card(r, c, ranks[i] || null)).join("")}</div>`
        : !ranked.length && c.query ? `<div class="panel empty">Aucun produit ne correspond à la recherche « ${esc(c.query)} » : retire-la ou change de mot-clé.</div>`
        : others ? `<div class="panel empty">Aucun produit n'est confirmé ${organ ? `pour « ${esc(organ)} » ` : ""}sur tous les critères. Pistes ci-dessous, à confirmer avec le service technique.</div>`
        : `<div class="panel empty">Aucun produit ne remplit toutes les contraintes. Assouplis la température ou l'organe, ou consulte le service technique. Les produits écartés sont listés ci-dessous avec la raison.</div>`) +
      group(near, "Prévus pour un organe voisin", `Leur fiche ne les annonce pas pour « ${esc(organ)} » mais pour un organe proche : à confirmer avec le service technique.`, !ok.length) +
      group(adds, "Additifs à ajouter à l'huile en place", "Ils améliorent l'huile du client (technologie MicPol®), ils ne la remplacent pas.", !ok.length && !near.length) +
      group(pending, "À vérifier : donnée manquante sur la fiche", "", !ok.length && !near.length && !adds.length) +
      group(out, "Produits écartés", "", !ok.length && !others);
  }

  // ------------------------------------------------------------ product sheet
  function openSheet(id) {
    const p = PRODUCTS.find((x) => x.id === id);
    if (!p) return;
    const list = (arr, fn) => (arr && arr.length ? `<ul>${arr.map((x) => `<li>${fn ? fn(x) : esc(x)}</li>`).join("")}</ul>` : `<p class="hint">Non renseigné</p>`);
    $("#sheet-title").textContent = p.name;
    $("#sheet-body").innerHTML = `
      <div class="badges">${p.nsf ? `<span class="badge ${C.nsfList(p).includes("H1") ? "h1" : "nsf"}">NSF ${esc(p.nsf)}${p.nsf_reg_no ? " · n° " + esc(p.nsf_reg_no) : ""}</span>` : `<span class="badge">sans NSF</span>`}<span class="badge">${esc(FAMILIES[p.family] || p.family)}</span>${sheetBadge(p)}</div>
      ${p.description_fr ? `<p class="desc">${esc(p.description_fr)}</p>` : ""}
      ${p.nsf_note ? `<p class="hint">${esc(p.nsf_note)}</p>` : ""}
      <dl class="kv"><dt>Température</dt><dd>${esc(tempTxt(p))}${p.temp_note ? `<div class="quote">${esc(p.temp_note)}</div>` : ""}</dd>
        <dt>Viscosité</dt><dd>${esc(viscTxt(p) || "—")}</dd><dt>Grade NLGI</dt><dd>${esc(p.nlgi || "—")}</dd>
        <dt>Base</dt><dd>${esc(p.base || "—")}</dd><dt>Conditionnements</dt><dd>${esc((p.formats || []).join(", ") || "—")}</dd></dl>
      <h3>Organes</h3>${list(p.applications, (a) => esc(C.APPLICATIONS[a] || a))}
      <h3>Propriétés</h3>${list(p.properties, (a) => esc(C.PROPERTIES[a] || a))}
      ${(p.key_claims || []).length ? `<h3>Arguments (source Interflon)</h3>${list(p.key_claims)}` : ""}
      <h3>Sources</h3>${list(p.source_urls, (u) => `<a href="${esc(safeUrl(u))}" target="_blank" rel="noopener">${esc(String(u).replace(/^https?:\/\//, "").slice(0, 64))}</a>`)}
      ${(p.source_docs || []).length ? `<h3>Documents Interflon internes</h3>${list(p.source_docs)}` : ""}
      ${(p.evidence || []).length ? `<details><summary class="hint" style="cursor:pointer">Preuves (${p.evidence.length}) : citation exacte derrière chaque valeur</summary>${list(p.evidence, (e) => `<b>${esc(e.field)}</b> <span class="quote">« ${esc(e.quote)} »</span> ${e.url ? `<a href="${esc(safeUrl(e.url))}" target="_blank" rel="noopener">source</a>` : `<span class="quote">(${esc(e.doc || "document interne")})</span>`}`)}</details>` : ""}
      ${(p.uncertain_fields || []).length ? `<h3>À confirmer</h3><ul class="hint">${p.uncertain_fields.map((x) => `<li>${esc(doubtTxt(x))}</li>`).join("")}</ul>` : ""}`;
    $("#sheet").hidden = false;
    $("#sheet-close").focus();
  }
  const closeSheet = () => { $("#sheet").hidden = true; };

  // ------------------------------------------------------------ copy
  let toastTimer;
  function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => (el.hidden = true), 3200); }
  // the first choices as shown on screen: "Choix 1", "Choix 1 (ex æquo)"…
  function choices(c) {
    const ok = groups(ranked).ok;
    const rk = choiceRanks(ok);
    return ok.slice(0, 3).map((r, i) => Object.assign({ label: `Choix ${rk[i].n}${rk[i].tie ? " (ex æquo)" : ""}` }, r));
  }
  // products sharing the last printed rank but left out of the three printed: named, never dropped silently
  function tiedLeftOut() {
    const ok = groups(ranked).ok;
    const rk = choiceRanks(ok);
    if (ok.length <= 3 || !rk[2]) return "";
    const rest = ok.slice(3).filter((r, i) => rk[i + 3] && rk[i + 3].n === rk[2].n);
    return rest.length ? `Également à égalité avec le choix ${rk[2].n} : ${rest.map((r) => r.product.name).join(", ")}.` : "";
  }
  // why there is nothing to copy or print yet ("" when there is)
  function recoBlocked(c) {
    const eq = currentEquiv();
    if (eq && noEquivalent(eq)) return "Ce produit n'a pas d'équivalent Interflon : rien à recommander.";
    if (c.badTemp || !hasCriteria(c)) return "Décris le besoin avant de copier ou d'imprimer.";
    if (!c.application) return "Choisis l'organe à lubrifier : la recommandation classe les produits pour cet organe.";
    if (!groups(ranked).ok.length) return "Aucun produit n'est vérifié sur tous les critères : rien à recommander pour l'instant.";
    return "";
  }
  function recoText() {
    const c = effective();
    const ok = choices(c);
    const need = [];
    const eq = currentEquiv();
    if (eq) need.push(`Produit en place : ${eqName(eq)} (${eqSpecs(eq)})`);
    if (crit.mode === "remplacement" && C.REPLACE_TYPES[crit.replaceType]) need.push("Remplacement : " + C.REPLACE_TYPES[crit.replaceType].label);
    if (c.food) need.push("Contact alimentaire : " + { oui: "oui (homologation NSF requise)", non: "non", nsp: "à préciser" }[c.food]);
    if (c.application) need.push("Organe : " + C.APPLICATIONS[c.application]);
    if (C.needRange(c)) need.push(`Température : ${C.needText(C.needRange(c))}`);
    if (c.env.length) need.push("Conditions : " + c.env.map((e) => C.PROPERTIES[e] || e).join(", "));
    const head = [crit.client, new Date().toLocaleDateString("fr-FR"), author ? "établie par " + author + ", Interflon France" : ""].filter(Boolean).join(" · ");
    const lines = ["RECOMMANDATION DE LUBRIFICATION", head, "", "Besoin :", ...need.map((x) => "  - " + x)];
    ok.forEach((r) => {
      const p = r.product;
      lines.push("", `${r.label} : ${p.name}${p.nsf ? " (NSF " + p.nsf + ")" : ""}`);
      if (c.food && c.food !== "non" && !C.foodOk(p, c.application)) lines.push("  ATTENTION : non homologué pour le contact alimentaire.");
      if (p.description_fr) lines.push("  " + p.description_fr);
      r.reasons.forEach((x) => lines.push(`  ${MARK[x.s] || "?"} ${x.t}`));
      lines.push(`  Température : ${tempTxt(p)}${C.tempStatus(p) === "ok" ? " (vérifiée)" : ""} · ${isVerified(p) ? "fiche vérifiée" : `${C.gapsText(p) || "données à confirmer"} (service technique)`}`);
    });
    if (tiedLeftOut()) lines.push("", tiedLeftOut());
    lines.push("", "Proposition indicative établie à partir des fiches produits Interflon, à confirmer avec la fiche technique et la FDS en vigueur.");
    return lines.join("\n");
  }

  // ------------------------------------------------------------ print (installed version only)
  function needList(c) {
    const need = [];
    const eq = currentEquiv();
    if (eq) need.push(`Produit en place : ${eqName(eq)} (${eqSpecs(eq)})`);
    if (crit.mode === "remplacement" && C.REPLACE_TYPES[crit.replaceType]) need.push("Remplacement : " + C.REPLACE_TYPES[crit.replaceType].label);
    if (c.food) need.push("Contact alimentaire : " + { oui: "oui, homologation NSF requise", non: "non", nsp: "à préciser" }[c.food]);
    if (c.application) need.push("Organe : " + C.APPLICATIONS[c.application]);
    if (C.needRange(c)) need.push(`Température de fonctionnement : ${C.needText(C.needRange(c))}`);
    if (c.env.length) need.push("Conditions : " + c.env.map((e) => C.PROPERTIES[e] || e).join(", "));
    if (c.formats.length) need.push("Conditionnement souhaité : " + c.formats.map((f) => C.FORMATS[f]).join(", "));
    if (c.iso_vg) need.push("Viscosité actuelle : ISO VG " + c.iso_vg);
    if (c.nlgi) need.push("Grade actuel : NLGI " + c.nlgi);
    return need;
  }
  async function printReco() {
    const c = effective();
    if (recoBlocked(c)) return toast(recoBlocked(c));
    const ok = choices(c);
    const date = new Date().toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });
    const mark = (s) => MARK[s] || "?";
    const area = $("#print-area");
    area.innerHTML = `<div class="pr">
      <header class="pr-head"><img src="img/logo-interflon.png" alt="Interflon">
        <div class="pr-title"><div class="pr-kicker">Recommandation de lubrification</div><div class="pr-client">${esc(crit.client || "Client")}</div>
        <div class="pr-meta">${esc(date)}${author ? ` · établie par ${esc(author)}, Interflon France` : ""}</div></div></header>
      <section class="pr-need"><h2>Besoin</h2><ul>${needList(c).map((x) => `<li>${esc(x)}</li>`).join("")}</ul></section>
      <h2 class="pr-h2">Produits proposés</h2>
      ${ok.map((r) => {
        const p = r.product;
        const good = r.reasons.filter((x) => x.s === "y");
        const check = r.reasons.filter((x) => x.s !== "y");
        const specs = [`Température : ${tempTxt(p)}`, p.viscosity_iso_vg ? `ISO VG ${p.viscosity_iso_vg}` : "", p.nlgi ? `NLGI ${p.nlgi}` : "", (p.formats || []).length ? `Conditionnements : ${p.formats.join(", ")}` : ""].filter(Boolean);
        return `<article class="pr-prod">
          <div class="pr-rank">${esc(r.label)}</div>
          <h3>${esc(p.name)}${p.nsf ? ` <span class="pr-nsf">NSF ${esc(p.nsf)}${p.nsf_reg_no ? " · n° " + esc(p.nsf_reg_no) : ""}</span>` : ""}</h3>
          ${c.food && c.food !== "non" && !C.foodOk(p, c.application) ? `<p class="pr-alert">Attention : produit non homologué pour le contact alimentaire. À n'utiliser que hors des zones de contact avec les denrées.</p>` : ""}
          ${p.description_fr ? `<p>${esc(p.description_fr)}</p>` : ""}
          ${good.length ? `<ul class="pr-ok">${good.map((x) => `<li><span>✓</span>${esc(x.t)}</li>`).join("")}</ul>` : ""}
          ${check.length ? `<p class="pr-sub">À vérifier avant utilisation</p><ul class="pr-check">${check.map((x) => `<li><span>${mark(x.s)}</span>${esc(x.t)}</li>`).join("")}</ul>` : ""}
          <p class="pr-specs">${esc(specs.join(" · "))} · ${isVerified(p) ? "fiche vérifiée sur document Interflon" : `${C.tempStatus(p) === "ok" ? "température vérifiée · " : ""}${esc(C.gapsText(p) || "données à confirmer")} (service technique Interflon)`}</p>
        </article>`;
      }).join("")}
      ${tiedLeftOut() ? `<p class="pr-sub">${esc(tiedLeftOut())}</p>` : ""}
      <footer class="pr-foot">Proposition indicative établie à partir des fiches produits Interflon. À confirmer avec la fiche technique et la fiche de données de sécurité en vigueur avant utilisation.<br>Interflon® et MicPol® sont des marques déposées d'Interflon BV.</footer>
    </div>`;
    area.hidden = false;
    const img = area.querySelector("img");
    if (img && !img.complete) await new Promise((res) => { img.onload = img.onerror = res; });
    document.body.classList.add("printing");
    window.print();
  }
  function copyReco() {
    const c = effective();
    if (recoBlocked(c)) return toast(recoBlocked(c));
    const text = recoText();
    const fallback = () => {
      $("#sheet-title").textContent = "Recommandation";
      $("#sheet-body").innerHTML = `<p class="hint">La copie automatique est refusée ici : sélectionne le texte.</p><textarea id="reco" rows="22" style="width:100%;font:13px var(--mono);background:var(--sunken);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px" readonly></textarea>`;
      $("#reco").value = text; $("#sheet").hidden = false; $("#reco").focus(); $("#reco").select();
    };
    try { navigator.clipboard.writeText(text).then(() => toast("Recommandation copiée : colle-la dans ton e-mail ou ton compte rendu."), fallback); } catch (e) { fallback(); }
  }

  // ------------------------------------------------------------ competitor search
  let sugItems = [];
  let sugIdx = -1;
  function drawSuggestions(words) {
    const box = $("#competitor-list");
    if (!box) return;
    box.innerHTML = sugItems.length
      ? sugItems.map(([e, i], k) => `<button type="button" role="option" data-eq="${i}" aria-selected="${k === sugIdx}">${eqName(e) === e.reference ? `<b>${esc(e.reference)}</b>` : `${esc(e.marque)} <b>${esc(e.reference)}</b>`}<small>${esc(e.type)}</small></button>`).join("")
      : `<p class="hint">Référence absente de la table : décris le produit avec les questions ci-dessous.</p>`;
    box.hidden = !words;
  }
  function showSuggestions(q) {
    const words = norm(q).split(/\s+/).filter(Boolean);
    sugItems = words.length ? EQUIV.map((e, i) => [e, i]).filter(([e]) => words.every((w) => norm(`${e.marque} ${e.reference} ${e.type}`).includes(w))).slice(0, 8) : [];
    sugIdx = sugItems.length ? 0 : -1;
    drawSuggestions(words.length);
  }
  // answers a competitor product can fill in; "retirer" puts back what was there before
  const FROM_COMPETITOR = ["replaceType", "application", "food", "tmin", "tmax", "iso_vg", "nlgi"];
  function applyCompetitor(e) {
    if (crit.competitor) undoCompetitor();
    const was = {};
    FROM_COMPETITOR.forEach((k) => { was[k] = crit[k]; });
    crit.competitor = eqKey(e);
    pickReplaceType(C.REPLACE_TYPES[e.replace_type] ? e.replace_type : "");
    if (e.application && C.APPLICATIONS[e.application]) crit.application = e.application;
    // a food-grade product in place means food contact; any other never lowers the rep's answer
    if (e.nsf === "H1") crit.food = "oui";
    // A data-sheet range is a product limit, not the machine's temperature: it only becomes
    // a criterion (upper limit only, when the rep gave none) for products whose purpose is heat.
    if (e.besoin_temp && known(e.temp_max_c) && crit.tmin === "" && crit.tmax === "") crit.tmax = String(e.temp_max_c);
    if (e.iso_vg) crit.iso_vg = String(e.iso_vg);
    if (e.nlgi) crit.nlgi = String(e.nlgi);
    crit.fromCompetitor = {};
    FROM_COMPETITOR.forEach((k) => { if (crit[k] !== was[k]) crit.fromCompetitor[k] = { was: was[k], set: crit[k] }; });
    changed(true);
  }
  // put back the answers the competitor changed, unless the rep changed them since
  function undoCompetitor() {
    Object.entries(crit.fromCompetitor || {}).forEach(([k, v]) => { if (crit[k] === v.set) crit[k] = v.was; });
    crit.fromCompetitor = {};
    crit.competitor = "";
  }
  function clearCompetitor() {
    undoCompetitor();
    changed(true);
  }
  // × on an active criterion
  function drop(key) {
    if (key === "competitor") return clearCompetitor();
    const [name, v] = key.split(":");
    if (v !== undefined) crit[name] = crit[name].filter((x) => x !== v);
    else if (name === "temp") { crit.tmin = ""; crit.tmax = ""; }
    else if (name === "replaceType") pickReplaceType("");
    else crit[name] = "";
    changed(true);
  }
  // the product type in place decides the organ (a leftover organ would override it)
  function pickReplaceType(v) {
    const before = C.REPLACE_TYPES[crit.replaceType];
    crit.replaceType = v;
    const t = C.REPLACE_TYPES[v];
    if (t && t.application) crit.application = t.application;
    else if (before && before.application === crit.application) crit.application = "";
  }
  // clear every answer, keep the starting point (besoin / remplacement)
  function reset() {
    crit = Object.assign(blank(), { mode: crit.mode });
    changed(true);
  }
  function showExample() {
    const client = crit.client;
    store.set(LS, Object.assign(blank(), { client }));
    crit = Object.assign(sanitize(EXAMPLE), { client });
    restored = false;
    isExample = true;
    renderQuestions();
    renderResults();
  }

  // ------------------------------------------------------------ events
  function bind() {
    $("#questions").addEventListener("mousedown", (e) => {
      const b = e.target.closest("[data-eq]");
      if (!b) return;
      e.preventDefault();
      applyCompetitor(EQUIV[+b.dataset.eq]);
    });
    $("#questions").addEventListener("keydown", (e) => {
      if (e.target.id !== "competitor" || $("#competitor-list").hidden) return;
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        if (sugItems.length) sugIdx = (sugIdx + (e.key === "ArrowDown" ? 1 : sugItems.length - 1)) % sugItems.length;
        drawSuggestions(true);
      } else if (e.key === "Enter" && sugIdx >= 0) {
        e.preventDefault();
        applyCompetitor(sugItems[sugIdx][0]);
      } else if (e.key === "Escape") $("#competitor-list").hidden = true;
    });
    $("#questions").addEventListener("focusout", (e) => { if (e.target.id === "competitor") setTimeout(() => { const box = $("#competitor-list"); if (box) box.hidden = true; }, 150); });
    $("#results-panel").addEventListener("click", (e) => {
      if (e.target.closest("[data-clear-competitor]")) return clearCompetitor();
      if (e.target.closest("[data-reset]")) return reset();
      if (e.target.closest("[data-example]")) return showExample();
      const d = e.target.closest("[data-drop]");
      if (d) drop(d.dataset.drop);
    });
    document.querySelector(".mode").addEventListener("click", (e) => { const b = e.target.closest("[data-mode]"); if (b) { crit.mode = b.dataset.mode; changed(true); } });
    $("#questions").addEventListener("click", (e) => {
      const pr = e.target.closest("[data-preset]");
      if (pr) { const [, a, b] = PRESETS[+pr.dataset.preset]; crit.tmin = String(a); crit.tmax = String(b); $("#tmin").value = crit.tmin; $("#tmax").value = crit.tmax; return changed(false); }
      const btn = e.target.closest("[data-v]");
      if (!btn) return;
      const box = btn.parentElement, name = box.dataset.name, v = btn.dataset.v;
      if (name === "replaceType") { pickReplaceType(crit.replaceType === v ? "" : v); return changed(true); }
      if (box.dataset.multi === "1") { crit[name] = crit[name].includes(v) ? crit[name].filter((x) => x !== v) : crit[name].concat(v); btn.setAttribute("aria-pressed", crit[name].includes(v)); }
      else { crit[name] = crit[name] === v ? "" : v; box.querySelectorAll("[data-v]").forEach((x) => x.setAttribute("aria-pressed", x.dataset.v === crit[name])); }
      changed(false);
    });
    $("#questions").addEventListener("input", (e) => {
      if (e.target.id === "competitor") return showSuggestions(e.target.value);
      if (e.target.id === "author") { author = e.target.value.trim().slice(0, 60); return store.set(LS_AUTHOR, author); }
      const k = { tmin: "tmin", tmax: "tmax", query: "query", iso_vg: "iso_vg", nlgi: "nlgi", client: "client" }[e.target.id];
      if (k) { crit[k] = e.target.value.trim(); changed(false); }
    });
    $("#reset").addEventListener("click", reset);
    $("#results").addEventListener("click", (e) => { const d = e.target.closest("[data-detail]"); if (d) openSheet(d.dataset.detail); });
    $("#copy").addEventListener("click", copyReco);
    $("#print").hidden = !CAN_PRINT;
    $("#print").addEventListener("click", printReco);
    window.addEventListener("afterprint", () => { document.body.classList.remove("printing"); $("#print-area").hidden = true; $("#print-area").innerHTML = ""; });
    $("#jump").addEventListener("click", () => $("#results-panel").scrollIntoView({ behavior: "smooth", block: "start" }));
    $("#sheet-close").addEventListener("click", closeSheet);
    $("#sheet").addEventListener("click", (e) => { if (e.target.id === "sheet") closeSheet(); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });
  }

  async function boot() {
    bind();
    author = String(store.get(LS_AUTHOR, "") || "").slice(0, 60);
    crit = sanitize(store.get(LS, null));
    restored = hasCriteria(effective());
    try {
      const doc = await (await fetch("data/produits.json")).json();
      PRODUCTS = (doc.products || []).filter((p) => !EQUIP.has(p.family));
      const pending = PRODUCTS.filter((p) => !isVerified(p));
      const noPack = pending.filter((p) => C.gaps(p).some((g) => g.label === "conditionnements")).length;
      if (doc._meta && doc._meta.avertissement) $("#data-note").textContent = doc._meta.avertissement + (pending.length ? ` ${pending.length} fiche(s) sur ${PRODUCTS.length} incomplète(s)${noPack ? `, dont ${noPack} sans conditionnements renseignés` : ""} : le badge de chaque fiche dit ce qui manque.` : "");
    } catch (e) {
      $("#banners").innerHTML = `<div class="banner error"><b>Catalogue indisponible</b><span>Le fichier des produits n'a pas pu être chargé. Recharge la page.</span></div>`;
    }
    try {
      const eqDoc = await (await fetch("data/equivalences.json")).json();
      EQUIV = (eqDoc.equivalences || []).filter((e) => e && e.marque && e.reference);
    } catch (e) {
      EQUIV = []; // optional: the selector works without the competitor table
    }
    renderQuestions();
    renderResults();
  }
  boot();
})();
</script>
